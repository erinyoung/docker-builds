name: Update Bot

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process-update:
    if: |
      (github.event.issue.pull_request == null) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@update-bot')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@update-bot'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Update Request
        env:
          EVENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          comment_on_issue() {
            local msg="$1"
            echo "Posting to issue #${ISSUE_NUMBER:-}: $msg"
            if [ -n "${ISSUE_NUMBER:-}" ]; then
              gh issue comment "$ISSUE_NUMBER" --body "$msg" > /dev/null || true
            fi
          }

          # 1. Sync repository with upstream StaPH-B/docker-builds
          echo "Syncing workspace with upstream StaPH-B/docker-builds..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/StaPH-B/docker-builds.git 2>/dev/null || git remote set-url upstream https://github.com/StaPH-B/docker-builds.git
          git fetch upstream "$DEFAULT_BRANCH"

          # Fast-forward local branch to match upstream
          git checkout "$DEFAULT_BRANCH"
          if ! git merge --ff-only "upstream/$DEFAULT_BRANCH"; then
            echo "Fast-forward not possible, performing merge commit..."
            git merge "upstream/$DEFAULT_BRANCH" -m "chore: sync with upstream StaPH-B/docker-builds"
          fi

          # Push synced master back to origin so fork is no longer stuck
          git push origin "$DEFAULT_BRANCH" || echo "Notice: Could not push updated default branch to fork origin, continuing with updated workspace."

          # 2. Extract command line and remove carriage returns
          cmd_line=$(echo "$EVENT_BODY" | tr -d '\r' | grep -m1 '@update-bot' | sed 's/.*@update-bot/@update-bot/' | tr -d '`' || true)

          if [ -z "\$cmd_line" ]; then
            echo "No @update-bot command detected."
            exit 0
          fi

          # 3. Tokenize command safely
          read -ra tokens <<< "\$cmd_line"

          if [ "\${#tokens[@]}" -lt 2 ]; then
            comment_on_issue "**Error (@update-bot):** Incomplete command. Syntax: \`@update-bot <tool> prior=<old> new=<new> <ARG>=<val>\`"
            exit 1
          fi

          tool="\${tokens[1]}"
          prior=""
          new=""
          declare -A extra_args

          strip_quotes() {
            local val="\$1"
            val="\${val%\"}"
            val="\${val#\"}"
            val="\${val%\'}"
            val="\${val#\'}"
            echo "\$val"
          }

          # 4. Parse versions and ARG key-value pairs
          for token in "\${tokens[@]:2}"; do
            case "\$token" in
              prior=*)
                prior=$(strip_quotes "${token#prior=}")
                ;;
              new=*)
                new=$(strip_quotes "${token#new=}")
                ;;
              *=*)
                key="\${token%%=*}"
                raw_val="\${token#*=}"
                extra_args["\$key"]=$(strip_quotes "$raw_val")
                ;;
              *)
                if [ -z "\$prior" ]; then
                  prior=$(strip_quotes "$token")
                elif [ -z "\$new" ]; then
                  new=$(strip_quotes "$token")
                fi
                ;;
            esac
          done

          if [ -z "$prior" ] \vert{}\vert{} [ -z "$new" ]; then
            comment_on_issue "**Error (@update-bot):** Both prior and new versions must be defined."
            exit 1
          fi

          echo "Target Tool: \$tool"
          echo "Prior Version: \$prior"
          echo "New Version: \$new"

          src_dir="build-files/$tool/$prior"
          dst_dir="build-files/$tool/$new"

          # 5. Validate directories
          if [ ! -d "build-files/\$tool" ]; then
            comment_on_issue "**Error (@update-bot):** Tool directory \`build-files/$tool\` not found."
            exit 1
          fi

          if [ ! -d "\$src_dir" ]; then
            available=$(ls -1 "build-files/$tool" 2>/dev/null | paste -sd ", " - || echo "none")
            comment_on_issue "**Error (@update-bot):** Prior directory \`$src_dir\` does not exist. Available versions: \$available"
            exit 1
          fi

          # 6. Copy files to new version directory
          mkdir -p "\$dst_dir"
          cp -r "$src_dir"/* "$dst_dir"/
          echo "Copied files from $src_dir to$dst_dir"

          dockerfile="\$dst_dir/Dockerfile"
          if [ ! -f "\$dockerfile" ]; then
            comment_on_issue "**Error (@update-bot):** No \`Dockerfile\` found in \`$dst_dir\`."
            exit 1
          fi

          # 7. Update ARGs in the new Dockerfile
          args_summary=""
          for key in "\${!extra_args[@]}"; do
            val="${extra_args[$key]}"
            sed -i -E "s|^([[:space:]]*ARG[[:space:]]+${key}[[:space:]]*=[[:space:]]*)([\"']?)[^\"'#]*([\"']?)([[:space:]]*(#.*)?)$|\1\"${val}\"\4\vert{}" "$dockerfile"
            args_summary="\${args_summary}- \`${key}=\"${val}\"\`"\$'\n'
          done

          sed -i -E "s|^([[:space:]]*LABEL[[:space:]]+software\.version[[:space:]]*=[[:space:]]*)([\"']?)${prior}([\"']?)([[:space:]]*(#.*)?)$|\1\"${new}\"\4\vert{}" "$dockerfile"

          # 8. Git commit and push to branch
          branch_name="update-$tool-$new"
          git checkout -B "\$branch_name"
          git add "\$dst_dir"

          if git diff --staged --quiet; then
            comment_on_issue "**Notice (@update-bot):** No changes detected for \`$dst_dir\`. Nothing was committed."
            exit 0
          fi

          git commit -m "feat(\$tool): update $tool to$new"
          git push origin "\$branch_name" --force

          # 9. Notify issue
          comment_on_issue "**Notice (@update-bot):** Files copied from \`$src_dir\` to \`$dst_dir\`, ARGs updated, and committed to branch \`$branch_name\`."
