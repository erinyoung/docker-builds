name: Update Bot

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  repository-projects: read

jobs:
  process-update:
    if: |
      (github.event.issue.pull_request == null) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@update-bot')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@update-bot'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Update Request
        env:
          EVENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          comment_on_issue() {
            local msg="$1"
            echo "Posting to issue #${ISSUE_NUMBER:-}: $msg"
            if [ -n "${ISSUE_NUMBER:-}" ]; then
              gh issue comment "$ISSUE_NUMBER" --body "$msg" > /dev/null || true
            fi
          }

          # 1. Extract command line and remove carriage returns
          cmd_line=$(echo "$EVENT_BODY" | tr -d '\r' | grep -m1 '@update-bot' | sed 's/.*@update-bot/@update-bot/' | tr -d '`' || true)

          if [ -z "$cmd_line" ]; then
            echo "No @update-bot command detected."
            exit 0
          fi

          # 2. Tokenize command safely
          read -ra tokens <<< "$cmd_line"

          if [ "${#tokens[@]}" -lt 2 ]; then
            comment_on_issue "**Error (@update-bot):** Incomplete command. Syntax: \`@update-bot <tool> prior=<old> new=<new> <ARG>=<val>\`"
            exit 1
          fi

          tool="${tokens[1]}"
          prior=""
          new=""
          declare -A extra_args

          strip_quotes() {
            local val="$1"
            val="${val%\"}"
            val="${val#\"}"
            val="${val%\'}"
            val="${val#\'}"
            echo "$val"
          }

          # 3. Parse versions and ARG key-value pairs
          for token in "${tokens[@]:2}"; do
            case "$token" in
              prior=*)
                prior=$(strip_quotes "${token#prior=}")
                ;;
              new=*)
                new=$(strip_quotes "${token#new=}")
                ;;
              *=*)
                key="${token%%=*}"
                raw_val="${token#*=}"
                extra_args["$key"]=$(strip_quotes "$raw_val")
                ;;
              *)
                if [ -z "$prior" ]; then
                  prior=$(strip_quotes "$token")
                elif [ -z "$new" ]; then
                  new=$(strip_quotes "$token")
                fi
                ;;
            esac
          done

          if [ -z "$prior" ] || [ -z "$new" ]; then
            comment_on_issue "**Error (@update-bot):** Both prior and new versions must be defined."
            exit 1
          fi

          echo "Target Tool: $tool"
          echo "Prior Version: $prior"
          echo "New Version: $new"

          src_dir="build-files/$tool/$prior"
          dst_dir="build-files/$tool/$new"

          # 4. If prior version is missing locally, pull just that directory from upstream
          if [ ! -d "$src_dir" ]; then
            echo "Directory $src_dir not found in local workspace. Checking upstream StaPH-B/docker-builds..."
            git remote add upstream https://github.com/StaPH-B/docker-builds.git 2>/dev/null || git remote set-url upstream https://github.com/StaPH-B/docker-builds.git
            git fetch upstream "$DEFAULT_BRANCH" --depth=1
            git checkout "upstream/$DEFAULT_BRANCH" -- "$src_dir" 2>/dev/null || true
            git reset HEAD "$src_dir" 2>/dev/null || true
          fi

          # 5. Validate directories
          if [ ! -d "build-files/$tool" ]; then
            comment_on_issue "**Error (@update-bot):** Tool directory \`build-files/$tool\` not found."
            exit 1
          fi

          if [ ! -d "$src_dir" ]; then
            available=$(ls -1 "build-files/$tool" 2>/dev/null | paste -sd ", " - || echo "none")
            comment_on_issue "**Error (@update-bot):** Prior directory \`$src_dir\` does not exist locally or upstream. Available versions: $available"
            exit 1
          fi

          # 6. Copy files to new version directory
          mkdir -p "$dst_dir"
          cp -r "$src_dir"/* "$dst_dir"/
          echo "Copied files from $src_dir to$dst_dir"

          dockerfile="$dst_dir/Dockerfile"
          if [ ! -f "$dockerfile" ]; then
            comment_on_issue "**Error (@update-bot):** No \`Dockerfile\` found in \`$dst_dir\`."
            exit 1
          fi

          # 7. Update ARGs in the new Dockerfile
          args_summary=""
          for key in "${!extra_args[@]}"; do
            val="${extra_args[$key]}"
            sed -i -E "s|^([[:space:]]*ARG[[:space:]]+${key}[[:space:]]*=[[:space:]]*)([\"']?)[^\"'#]*([\"']?)([[:space:]]*(#.*)?)$|\1\"${val}\"\4|" "$dockerfile"
            args_summary="${args_summary}- \`${key}=\"${val}\"\`"$'\n'
          done

          sed -i -E "s|^([[:space:]]*LABEL[[:space:]]+software\.version[[:space:]]*=[[:space:]]*)([\"']?)${prior}([\"']?)([[:space:]]*(#.*)?)$|\1\"${new}\"\4|" "$dockerfile"

          # 8. Validate and compute Dockerfile diff
          if [ ! -f "$src_dir/Dockerfile" ]; then
            comment_on_issue "**Error (@update-bot):** No prior \`Dockerfile\` found in \`$src_dir\`."
            exit 1
          fi

          diff_status=0
          dockerfile_diff=$(diff -u \
            --label "$src_dir/Dockerfile (prior)" \
            --label "$dst_dir/Dockerfile (new)" \
            "$src_dir/Dockerfile" "$dst_dir/Dockerfile") || diff_status=$?

          if [ "$diff_status" -gt 1 ]; then
            comment_on_issue "**Error (@update-bot):** Failed to compare the prior and new Dockerfiles."
            exit 1
          fi

          if [ "$diff_status" -eq 0 ]; then
            dockerfile_diff="No differences detected between Dockerfiles."
          fi

          # 9. Commit and push the new version branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch_name="update-$tool-$new"

          # Explicitly base the branch on the repository's default branch
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$branch_name" "origin/$DEFAULT_BRANCH"

          git add "$dst_dir"

          if git diff --staged --quiet; then
            comment_on_issue "**Notice (@update-bot):** No changes detected for \`$dst_dir\`. Nothing was committed."
            exit 0
          fi

          git commit -m "feat($tool): update $tool to $new"
          git push origin "$branch_name" --force

          # 10. Comment on the original issue
          comment_file=$(mktemp)
          trap 'rm -f "$comment_file"' EXIT

          {
            echo "## Update Bot: Dockerfile update prepared"
            echo ""
            echo "Successfully committed and pushed the updated Dockerfile."
            echo ""
            echo "- **Branch:** [\`$branch_name\`](https://github.com/$GITHUB_REPOSITORY/tree/$branch_name)"
            echo "- **Prior version:** \`$prior\`"
            echo "- **New version:** \`$new\`"
            echo "- **Source:** \`$src_dir/Dockerfile\`"
            echo "- **Destination:** \`$dst_dir/Dockerfile\`"
            echo ""
            echo "### Dockerfile diff"
            echo ""
            echo '```diff'
            printf '%s\n' "$dockerfile_diff"
            echo '```'
            echo ""
            echo "_No pull request was created._"
          } > "$comment_file"

          gh issue comment "$ISSUE_NUMBER" \
            --body-file "$comment_file"


          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$comment_file" > /dev/null || true
          fi
          rm -f "$comment_file"
